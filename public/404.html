<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <main class="container">

                <div class="window-titlebar" aria-hidden="true">

                </div>
                <div class="window-body">
                    <h1 class="prompt" id="notfound-heading">
                        <span class="path">mukolwesofts:$</span>
                        <span class="cmd" id="bad-path">?</span>
                    </h1>
                    <p class="project-desc">
                        zsh: no such file or directory: <span id="bad-path-echo">?</span>
                    </p>
                    <p class="project-desc">exit code 127 — this page doesn't exist.</p>
                    <p class="project-meta">
                        <span class="project-links">
                            <a href="/">home</a>
                        </span>
                    </p>
